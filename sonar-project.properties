# Identificativo del progetto
sonar.projectKey=jigglycard

# Nome del progetto
sonar.projectName=Jigglycard

# Versione del progetto
sonar.projectVersion=1.0

# Percorso alla directory di codice sorgente
sonar.sources=./
# Il token NON va qui (finirebbe nel repository): lo scanner lo legge
# dalla variabile d'ambiente SONAR_TOKEN.

# Percorso al tuo file di build (se hai un processo di build)
sonar.exclusions=**/*.test.js,**/*.spec.js

# Esegui il build prima dell'analisi (se applicabile)
sonar.buildbreaker=true
